name: WeatherActivities

options:
  bundleIdPrefix: com.collinson
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    # Configured for Simulator runs so it builds on any machine with no signing team.
    CODE_SIGN_IDENTITY: ""
    CODE_SIGNING_REQUIRED: NO
    CODE_SIGNING_ALLOWED: NO

targets:
  WeatherActivities:
    type: application
    platform: iOS
    sources:
      - path: Sources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.collinson.weatheractivities
        PRODUCT_NAME: WeatherActivities
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        SWIFT_EMIT_LOC_STRINGS: YES

  WeatherActivitiesTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - target: WeatherActivities
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES

schemes:
  WeatherActivities:
    build:
      targets:
        WeatherActivities: all
    test:
      gatherCoverageData: true
      coverageTargets:
        - WeatherActivities
      targets:
        - WeatherActivitiesTests
    run:
      config: Debug
    profile:
      config: Release
